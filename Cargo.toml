[package]
edition = "2021"
name = "daikin2mqtt"
version = "0.1.1"
default-run = "daikin2mqtt"

[dependencies]
bytes = "1.5.0"
env_logger = "0.11.2"
tokio = { version = "1.36.0", features = ["macros", "net", "io-util", "rt"] }
log = "0.4.21"
clap = { version = "4.5.2", features = ["derive", "env"] }
rumqttc = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11.25", default-features = false, features = [
    "json",
    "rustls-tls",
] }
test-log = "0.2.15"
openid = { version = "0.12", default-features = false, features = ["rustls"] }

[dev-dependencies]
env_logger = "*"
