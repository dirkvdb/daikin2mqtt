[package]
edition     = "2021"
name        = "daikin2mqtt"
version     = "0.1.1"
default-run = "daikin2mqtt"

[dependencies]
bytes = "1.10"
env_logger = "0.11"
tokio = { version = "1.44", features = ["macros", "net", "io-util", "rt"] }
log = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
rumqttc = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
test-log = "0.2"
openid = { version = "0.16", default-features = false, features = ["rustls"] }

[dev-dependencies]
env_logger = "*"
