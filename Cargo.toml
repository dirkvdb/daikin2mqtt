[package]
edition = "2021"
name = "daikin2mqtt"
version = "0.2.1"
default-run = "daikin2mqtt"

[dependencies]
bytes = "1.12"
env_logger = "0.11"
tokio = { version = "1.54", features = ["macros", "net", "io-util", "rt"] }
log = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
rumqttc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
test-log = "0.2"
oauth2 = { version = "5", default-features = false, features = ["timing-resistant-secret-traits"] }
secretspec = { version = "0.21", default-features = false, features = ["keyring"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[dev-dependencies]
env_logger = "*"
tempfile = "3"
