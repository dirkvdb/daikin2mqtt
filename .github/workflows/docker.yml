name: Publish Docker image

on:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load container image
        run: |
          nix build .#packages.x86_64-linux.container --out-link result-container --print-build-logs
          docker load --input result-container

      - name: Smoke-test container image
        run: docker run --rm --network none dirkvdb/daikin2mqtt:latest --help

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push container image
        run: docker push dirkvdb/daikin2mqtt:latest
